plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { worldmonster { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}
repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup('software.bernie.geckolib') }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
}

// The five original Blockbench PNGs are stored as a small source archive to
// keep their binary bytes intact in Git. Extract them into the resource set
// before processResources so the mod JAR receives the normal assets paths.
def generatedWorldSwordResources = layout.buildDirectory.dir('generated/resources/worldSword')
sourceSets.main.resources.srcDir(generatedWorldSwordResources)

tasks.register('extractWorldSwordTextures', Sync) {
    from zipTree(layout.projectDirectory.file('world_sword_textures.zip'))
    into generatedWorldSwordResources
}

tasks.named('processResources') {
    dependsOn tasks.named('extractWorldSwordTextures')
}

processResources {
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_version', mod_version
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand 'mod_id': mod_id, 'mod_name': mod_name, 'mod_version': mod_version
    }
}
jar {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': 'WorldBattles',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'WorldBattles'
        ])
    }
}
