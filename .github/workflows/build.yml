name: Build World Monster Mod
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore original monster texture
        run: |
          if [ -f texture_monster.b64 ]; then
            base64 --decode texture_monster.b64 > src/main/resources/assets/worldmonster/textures/entity/worldmonster.png
            rm texture_monster.b64
          fi
          file src/main/resources/assets/worldmonster/textures/entity/worldmonster.png
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: WorldMonsterMod-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
